# The configuration file for docking actions that robots can perform
# FleetName: The name of the fleet
#   DockName: The name of the docking waypoint
#     level_name: The level name
#     path: The waypoints that the robot will pass through during the docking process
#     finish_waypoint: The name of the waypoint where the robot will end up at the end of the docking process
#
# Note: These waypoints are in (x meters, y meters, yaw radian) form
#
# If loaded correctly, you will be able to echo the msg via:
#   ros2 topic echo /dock_summary --qos-durability transient_local --qos-reliability reliable
#
# Configuring Cleaning path:
#    The full cleaning path which the robot will travel along. When configuring, the first
#    waypoint is required to be the current robot's waypoint.

cleanerBotA:
  clean_inno_room:
    level_name: "L1"
    # Note: These waypoints are in (x meters, y meters, yaw radian) form
    # Keep the route tight to the room center to avoid wall contact.
    path: [ [67.30, -24.10, 0.0],
      [67.50, -24.40, 0.0],
      [68.70, -24.10, 0.0]
    ]
    finish_waypoint: "clean_inno_room"
    
  clean_conference_room:
    level_name: "L1"
    # Keep the sweep inside the conference-room interior to avoid clipping the walls.
    path: [ [62.50, -31.10, 0.0],
      [62.60, -44.80, 0.0],
      [68.30, -44.50, 0.0],
      [68.80, -33.00, 0.0]
    ]
    finish_waypoint: "clean_conference_room"

  meeting_room1:
    level_name: "L1"
    path: [ [79.70, -30.10, 0.0],
      [80.70, -30.40, 0.0]
    ]
    finish_waypoint: "meeting_room1"
  
  clean_sec_hot_desk:
    level_name: "L1"
    path: [ [57.70, -28.75, 0.0],
      [58.50, -29.55, 0.0],
      [56.90, -29.95, 0.0],
      [48.10, -30.07 ,0.0],
      [37.70, -29.75, 0.0],
      [37.40, -27.15, 0.0],

      [39.06, -20.95, 0.0],
      [39.47, -21.84, 0.0],
      [40.23, -20.75, 0.0],

      [43.40, -21.05, 0.0],
      [44.30, -21.75, 0.0],
      [45.70, -21.08, 0.0],
      [47.70, -21.15, 0.0],

      [50.90, -21.08 , 0.0],
      [52.46, -23.20, 0.0],
      [52.30, -23.80, 0.0],
      [53.26, -23.20, 0.0],
      [56.60, -23.09, 0.0],
      
    ]
    finish_waypoint: "clean_sec_hot_desk"